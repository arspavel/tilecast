name: Tilecast webOS Player Release

on:
  push:
    tags:
      - "player-webos-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example player-webos-v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: webos-player-release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve and validate release
        id: release
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then tag="${MANUAL_TAG}"; fi
          if [[ ! "${tag}" =~ ^player-webos-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must use player-webos-v<version>." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          app_version="$(node -p "require('./apps/player-webos/appinfo.json').version")"
          if [ "${version}" != "${app_version}" ]; then
            echo "Tag version ${version} does not match appinfo.json ${app_version}." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli

      - name: Package webOS application
        run: |
          mkdir -p "${RUNNER_TEMP}/webos-release"
          cd "${RUNNER_TEMP}/webos-release"
          ares-package "${GITHUB_WORKSPACE}/apps/player-webos"
          test -s "org.tilecast.player.webos_${{ steps.release.outputs.version }}_all.ipk"
          sha256sum "org.tilecast.player.webos_${{ steps.release.outputs.version }}_all.ipk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: tilecast-player-webos-${{ steps.release.outputs.version }}
          path: ${{ runner.temp }}/webos-release/org.tilecast.player.webos_${{ steps.release.outputs.version }}_all.ipk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          artifact="${RUNNER_TEMP}/webos-release/org.tilecast.player.webos_${RELEASE_VERSION}_all.ipk"
          gh release create "${RELEASE_TAG}" "${artifact}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Tilecast Player for webOS ${RELEASE_VERSION}" \
            --generate-notes
